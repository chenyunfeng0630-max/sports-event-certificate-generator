name: Bug report
description: Report a reproducible defect using fictional data only
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include participant data, credentials, private URLs, or production logs. Use fictional examples only."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use fictional identifiers and names.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Privacy check
      options:
        - I confirm this report contains fictional data only
    validations:
      required: true
